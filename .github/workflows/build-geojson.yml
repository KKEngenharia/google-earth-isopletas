name: Gerar GeoJSON

on:
  push:
    branches: [main]
    paths:
      - "**.kml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "**.kml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Falha o job se algum KML estiver quebrado ou sem features validas.
      - run: npm run build

      # So publica o dist/ em push na main; em PR o build serve apenas de validacao.
      - name: Commitar dist/ atualizado
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- dist && [ -z "$(git ls-files --others --exclude-standard dist)" ]; then
            echo "dist/ ja esta atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: atualizar GeoJSON gerado dos KMLs"
          git push
